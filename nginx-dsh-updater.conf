# 限流 zone
limit_req_zone $binary_remote_addr zone=dsh_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dsh_api_write:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dsh.huilinsh.cn 64.90.30.139;
    return 301 https://dsh.huilinsh.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsh.huilinsh.cn;

    ssl_certificate /etc/letsencrypt/live/dsh.huilinsh.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.huilinsh.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    server_tokens off;
    include /etc/nginx/dsh-security-headers.conf;

    # 软件分发（静态文件）
    location = /dsh-plugin-updater.exe {
        alias /var/www/dsh-updater/dsh-plugin-updater.exe;
        include /etc/nginx/dsh-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
    }
    location = /plugins.json {
        alias /var/www/dsh-updater/plugins.json;
        default_type application/json;
        include /etc/nginx/dsh-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
    }

    # 插件列表 → 代理（带签名）
    location = /api/plugins/list {
        proxy_pass http://127.0.0.1:8073;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 写操作（注册/登录/反馈等）
    location ~ ^/api/(auth/(register|login)|feedback|comments|favorites|shares) {
        limit_req zone=dsh_api_write burst=5 nodelay;
        include /etc/nginx/dsh-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其他所有 API 和页面 → Nuxt SSR
    location / {
        limit_req zone=dsh_general burst=10 nodelay;
        include /etc/nginx/dsh-security-headers.conf;
        add_header Access-Control-Allow-Origin * always;
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
