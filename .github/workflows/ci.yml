name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-desktop:
    name: Desktop (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  check-vue:
    name: Vue type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: src-vue
      - run: npx vue-tsc --noEmit
        working-directory: src-vue

  check-website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: website
      - run: npx nuxi build --preset=node-server
        working-directory: website
        env:
          NODE_ENV: test
