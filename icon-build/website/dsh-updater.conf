server {
    listen 80;
    listen [::]:80;
    server_name dsh.huilinsh.cn 64.90.30.139;
    return 301 https://dsh.huilinsh.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsh.huilinsh.cn;

    ssl_certificate /etc/letsencrypt/live/dsh.huilinsh.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.huilinsh.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # 软件分发与市场目录数据（静态保留，供下载页/客户端使用）
    location = /dsh-plugin-updater.exe {
        alias /var/www/dsh-updater/dsh-plugin-updater.exe;
        add_header Access-Control-Allow-Origin *;
    }
    location = /plugins.json {
        alias /var/www/dsh-updater/plugins.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # 官网（用户自建 Nuxt3 SSR @127.0.0.1:8072）
    location / {
        proxy_pass http://127.0.0.1:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
