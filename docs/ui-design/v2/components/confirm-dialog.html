<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认对话框</title>
<style>
:root{--danger:#EF4444;--warning:#F59E0B;--primary:#6366F1;--bg:#0F172A;--text:#F8FAFC;--muted:#94A3B8}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:40px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{width:420px;padding:32px;border-radius:20px;background:rgba(30,41,59,0.95);border:1px solid rgba(255,255,255,0.1);text-align:center}
.warning-icon{font-size:48px;margin-bottom:16px}
.modal h3{font-size:18px;font-weight:600;margin-bottom:8px}
.modal p{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.modal-footer{display:flex;gap:12px;justify-content:center}
.btn{padding:10px 24px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all 0.2s}
.btn-danger{background:rgba(239,68,68,0.2);color:var(--danger);border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:rgba(239,68,68,0.3)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.1)}
.btn-ghost:hover{background:rgba(255,255,255,0.05)}
</style>
</head>
<body>
<div class="modal-overlay">
  <div class="modal">
    <div class="warning-icon">⚠️</div>
    <h3>确认卸载插件？</h3>
    <p>这将删除 <strong>长期记忆插件</strong>（v0.8.0）。旧版本已被备份，可随时恢复。</p>
    <div style="font-size:12px;color:var(--muted);margin-bottom:20px;padding:12px;background:rgba(0,0,0,0.2);border-radius:8px">
      备份位置：C:\Users\niufe\.dsh\plugins\backup\dsh-plugin-memory@0.8.0
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost">取消</button>
      <button class="btn btn-danger">确认卸载</button>
    </div>
  </div>
</div>
</body>
</html>
